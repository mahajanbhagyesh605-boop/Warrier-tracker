<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: url('https://i.imgur.com/8QfQZ6L.jpg') no-repeat center/cover;
    color: white;
}

.overlay {
    background: rgba(0,0,0,0.7);
    min-height: 100vh;
    padding: 20px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.bar {
    width: 60%;
    height: 10px;
    border: 1px solid #00aaff;
}

.fill {
    height: 100%;
    background: #00aaff;
}

.card {
    margin-top: 30px;
    border: 1px solid #00aaff;
    padding: 20px;
    border-radius: 10px;
    background: rgba(0,0,0,0.6);
}

.task {
    display: flex;
    justify-content: space-between;
    margin: 15px 0;
}

button {
    background: none;
    border: 1px solid #00aaff;
    color: #00aaff;
    padding: 5px 10px;
}

input {
    width: 70%;
    padding: 10px;
    background: transparent;
    border: 1px solid #00aaff;
    color: white;
}
</style>
</head>

<body>

<div class="overlay">

<div class="top">
    <div>
        LVL: <span id="level">1</span>
        <div class="bar">
            <div class="fill" id="xpBar"></div>
        </div>
    </div>

    <div>
        STREAK: <span id="streak">0</span>
    </div>
</div>

<h1>DAILY TASKS</h1>

<div class="card">
    <input id="taskInput" placeholder="New Task">
    <button onclick="addTask()">Add</button>

    <div id="taskList"></div>
</div>

</div>

<script>
let level = parseInt(localStorage.getItem("level")) || 1;
let streak = parseInt(localStorage.getItem("streak")) || 0;
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let done = JSON.parse(localStorage.getItem("done")) || [];
let lastDate = localStorage.getItem("date") || new Date().toDateString();

function newDayCheck() {
    let today = new Date().toDateString();
    if (today !== lastDate) {

        if (tasks.length > 0 && done.length === tasks.length) {
            streak++;
        } else {
            streak = 0;
        }

        done = [];
        lastDate = today;

        localStorage.setItem("streak", streak);
        localStorage.setItem("date", today);
    }
}

newDayCheck();

function xpPerTask() {
    return tasks.length ? Math.floor(100 / tasks.length) : 0;
}

function xp() {
    return done.length * xpPerTask();
}

function addTask() {
    let val = taskInput.value;
    if (!val) return;

    tasks.push(val);
    taskInput.value = "";
    save();
    render();
}

function completeTask(i) {
    if (!done.includes(i)) done.push(i);

    if (xp() >= 100 && streak >= level) {
        level++;
        streak = 0;
        alert("LEVEL UP");
    }

    save();
    render();
}

function save() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
    localStorage.setItem("done", JSON.stringify(done));
    localStorage.setItem("level", level);
}

function render() {
    taskList.innerHTML = "";

    tasks.forEach((t, i) => {
        let completed = done.includes(i);

        taskList.innerHTML += `
        <div class="task">
            <span style="${completed ? 'text-decoration:line-through' : ''}">
                ${t}
            </span>
            <button onclick="completeTask(${i})">✔</button>
        </div>`;
    });

    document.getElementById("level").innerText = level;
    document.getElementById("streak").innerText = streak;

    let percent = xp();
    document.getElementById("xpBar").style.width = percent + "%";
}

render();
</script>

</body>
</html>
