<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna System</title>

<style>
body {
    margin:0;
    font-family:sans-serif;
    background:#05070d;
    color:#00aaff;
}
.container {max-width:500px;margin:auto;padding:15px;}
.bar {height:10px;border:1px solid #00aaff;}
.fill {height:100%;background:#00aaff;}
.card {border:1px solid #00aaff33;padding:10px;margin-top:15px;}
.task {display:flex;justify-content:space-between;margin:8px 0;}
input,select,button {
    background:transparent;
    border:1px solid #00aaff;
    color:white;
    padding:5px;
}
.grid {display:grid;grid-template-columns:repeat(20,1fr);gap:3px;}
.box {width:100%;padding-top:100%;background:#111;}
</style>
</head>

<body>
<div class="container">

<h2>KRISHNA</h2>
<p>Level: <span id="level"></span> | Rank: <span id="rank"></span></p>

<div class="bar"><div id="xpBar" class="fill"></div></div>
<p>XP: <span id="xp"></span>/100</p>

<p>Streak: <span id="streak"></span></p>
<p>Timer: <span id="timer"></span></p>

<div class="card">
<h3>Stats</h3>
<p>Strength: <span id="str"></span></p>
<p>Knowledge: <span id="int"></span></p>
<p>Discipline: <span id="disc"></span></p>
<p>Maturity: <span id="mat"></span></p>
</div>

<div class="card">
<h3>Add Task</h3>
<input id="taskName" placeholder="Task">
<input id="taskCount" type="number" placeholder="Target">
<select id="taskType">
<option value="Strength">Strength</option>
<option value="Knowledge">Knowledge</option>
</select>
<button id="addBtn">Add</button>
</div>

<div class="card" id="taskList"></div>

<div class="card">
<h3>Year Progress</h3>
<div class="grid" id="grid"></div>
</div>

</div>

<script>
const taskName = document.getElementById("taskName");
const taskCount = document.getElementById("taskCount");
const taskType = document.getElementById("taskType");
const addBtn = document.getElementById("addBtn");

let data = JSON.parse(localStorage.data || "{}");

if (!data.level) {
    data = {
        level:1, streak:0,
        strength:0, knowledge:0,
        discipline:0, maturity:0,
        tasks:[],
        grid:{},
        lastDate:new Date().toDateString()
    };
}

function getDayOfYear(date){
    let start=new Date(date.getFullYear(),0,0);
    return Math.floor((date-start)/(1000*60*60*24));
}

function rank(){
    let l=data.level;
    if(l<=5)return"E";
    if(l<=10)return"D";
    if(l<=20)return"C";
    if(l<=35)return"B";
    if(l<=50)return"A";
    return"S";
}

function xpPerTask(){
    return data.tasks.length?100/data.tasks.length:0;
}

function xp(){
    let completed=data.tasks.filter(t=>t.done>=t.total).length;
    return completed*xpPerTask();
}

function newDay(){
    let today=new Date().toDateString();

    if(today!==data.lastDate){
        let dayIndex=getDayOfYear(new Date());

        let allDone=data.tasks.length && data.tasks.every(t=>t.done>=t.total);

        if(allDone){
            data.streak++;
            data.discipline++;
            data.maturity++;
            data.grid[dayIndex]=true;
        } else {
            data.streak=0;
            data.grid[dayIndex]=false;
        }

        data.tasks.forEach(t=>t.done=0);
        data.lastDate=today;
        save();
    }
}

function addTask(){
    let n = taskName.value.trim();
    let c = parseInt(taskCount.value);
    let t = taskType.value;

    if(!n || !c) return;

    data.tasks.push({name:n,total:c,done:0,type:t});

    taskName.value="";
    taskCount.value="";

    save();
    render();
}

addBtn.addEventListener("click", addTask);

function doTask(i){
    let t=data.tasks[i];

    if(t.done < t.total){
        t.done++;

        if(t.type==="Strength") data.strength++;
        if(t.type==="Knowledge") data.knowledge++;
    }

    if(xp()>=100 && data.streak>=data.level){
        data.level++;
        data.streak=0;
        alert("⚔️ LEVEL UP ⚔️");
    }

    save();
    render();
}

function deleteTask(i){
    if(confirm("Delete task?")){
        data.tasks.splice(i,1);
        save();
        render();
    }
}

function save(){
    localStorage.data=JSON.stringify(data);
}

function render(){
    const taskList=document.getElementById("taskList");
    taskList.innerHTML="";

    data.tasks.forEach((t,i)=>{
        taskList.innerHTML+=`
        <div class="task">
            ${t.name} [${t.done}/${t.total}]
            <div>
            <button onclick="doTask(${i})">+</button>
            <button onclick="deleteTask(${i})">X</button>
            </div>
        </div>`;
    });

    document.getElementById("level").innerText=data.level;
    document.getElementById("rank").innerText=rank();
    document.getElementById("streak").innerText=data.streak;
    document.getElementById("xp").innerText=Math.floor(xp());
    document.getElementById("xpBar").style.width=xp()+"%";

    document.getElementById("str").innerText=data.strength;
    document.getElementById("int").innerText=data.knowledge;
    document.getElementById("disc").innerText=data.discipline;
    document.getElementById("mat").innerText=data.maturity;

    renderGrid();
}

function renderGrid(){
    let grid=document.getElementById("grid");
    grid.innerHTML="";

    let todayIndex=getDayOfYear(new Date());

    for(let i=1;i<=365;i++){
        let box=document.createElement("div");
        box.className="box";

        if(i<todayIndex){
            box.style.background = data.grid[i] ? "#00ff88" : "#ff4444";
        } else if(i===todayIndex){
            box.style.background="#00aaff";
        }

        grid.appendChild(box);
    }
}

function timer(){
    let now=new Date();
    let end=new Date();
    end.setHours(24,0,0,0);

    let d=end-now;

    let h=Math.floor(d/1000/60/60);
    let m=Math.floor(d/1000/60)%60;
    let s=Math.floor(d/1000)%60;

    document.getElementById("timer").innerText=`${h}:${m}:${s}`;
}

setInterval(timer,1000);

newDay();
render();
</script>
</body>
</html>
